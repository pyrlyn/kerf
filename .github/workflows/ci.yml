# Rust CI through pyrlyn/ci's ci-rust.yml (fmt once, then clippy --all-targets
# with -D warnings, check and cargo test per target). Targets: Linux x86_64,
# macOS arm64 (aarch64-apple-darwin on the xcode-27 image) and Windows x86_64.
# Intel macOS (x86_64-apple-darwin) is not supported. When the repository
# variable MACOS_CI_DISABLED is set the macOS entry drops out of the matrix
# (the same pattern as scull's ci.yml).
# Shared workflows: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust comes from mise.toml (1.99.0), the single source of the pin; ci-rust
  # fails the job when `rustc --version` is anything else. `crates/kerf-core` is
  # the only member today (a stub until T2.1/T2.2 fill it in). The `matrix`
  # input lists the three supported targets explicitly — not the shared
  # pyrlyn matrix, which also has Linux aarch64.
  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main
    # ci-rust cancels the whole run when a job fails (cancel-run-on-failure),
    # which needs `actions: write` on the calling job.
    permissions:
      contents: read
      actions: write
    with:
      # ketch alongside Rust: the `kerf-binaries` tests run the real binary.
      mise-install-args: rust github:pyrlyn/ketch
      # The offscreen render test in `kerf-render` needs a GPU adapter: Mesa's
      # lavapipe on Linux, WARP on Windows, Metal on macOS. KERF_REQUIRE_GPU
      # turns a missing adapter into a failure instead of a silent skip.
      setup-command: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers
        fi
        echo KERF_REQUIRE_GPU=1 >> "$GITHUB_ENV"
      matrix: ${{ vars.MACOS_CI_DISABLED == 'true' && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"xcode-27","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]' }}

  # Which runner the macOS host job uses: pyrlyn/ci's macos-runner action reads
  # MACOS_RUNNER (unset or `hosted` = the hosted label, `xcode-27-local` = the
  # dedicated Mac).
  macos-runner:
    if: vars.MACOS_CI_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@3fa4275e525269297a4d193c427f965ad9dd7544 # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["xcode-27"]'

  # The macOS host (`macos/`, T12.4). SwiftPM cannot build Cargo crates, so
  # Cargo builds kerf-ffi's static library first; the Swift tests then draw
  # through it on the runner's Metal device.
  macos-host:
    needs: macos-runner
    if: >-
      vars.MACOS_CI_DISABLED != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Fork pull requests keep the hosted label: a self-hosted runner would run their code.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'xcode-27' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pyrlyn/ci/.github/actions/setup-xcode@3fa4275e525269297a4d193c427f965ad9dd7544 # main
        with:
          version: "27"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust
      - name: Build the C ABI library
        run: cargo build --locked -p kerf-ffi
      - name: Format
        run: xcrun swift-format lint --strict -r Sources Tests Package.swift
      - name: Build
        run: swift build --arch arm64
      - name: Test
        run: swift test --arch arm64
