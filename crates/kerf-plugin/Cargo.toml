[package]
name = "kerf-plugin"
description = "Kerf's WASM plugin host: cox's manifest and ABI on the shared wasm-plugin-host engine, with lazy activation and crash-to-disable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
cox-plugin-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
wasm-plugin-host = { workspace = true }

# iOS gives apps no executable memory at run time, so wasmtime cannot JIT
# there; Android takes the same backend so both mobile builds behave alike.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
wasm-plugin-host = { workspace = true, features = ["pulley"] }

[features]
# Plugins on wasmtime's Pulley interpreter instead of native code (T15).
# Mobile targets get it on their own; desktop CI turns it on to run the
# plugin tests against the interpreter.
interpreter = ["wasm-plugin-host/pulley"]

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
