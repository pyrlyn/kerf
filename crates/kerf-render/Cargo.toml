[package]
name = "kerf-render"
description = "Kerf's GPU editor renderer: lays out a kerf-core frame with cosmic-text and draws it with wgpu and glyphon inside a host's native view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
kerf-core = { workspace = true }
wgpu = { workspace = true }
glyphon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
