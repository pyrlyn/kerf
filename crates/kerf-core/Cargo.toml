[package]
name = "kerf-core"
description = "Kerf's core without UI: text buffer with undo/redo, edit events, bounded queues, a single-threaded event loop and Workspace Trust with its trust file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
ropey = { workspace = true }
thiserror = { workspace = true }
fs-kit = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
