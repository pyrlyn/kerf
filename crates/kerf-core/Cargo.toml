[package]
name = "kerf-core"
description = "Text buffer, replace-edits with undo/redo, and edit events for Kerf's core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
ropey = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
