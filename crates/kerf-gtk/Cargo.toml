[package]
name = "kerf-gtk"
description = "Kerf's Linux host: a GTK 4 window over kerf-ffi's C ABI, showing the Slint-drawn editor with GTK input, input methods and caret"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[test]]
name = "host"
# GTK may be used only from the thread that initialised it, and libtest runs
# tests on worker threads, so the host test is its own `main`.
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
gtk = { workspace = true }
kerf-ffi = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
# The host calls Kerf through its C ABI; every `unsafe` block says which
# promise of `include/kerf.h` it keeps.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
