[package]
name = "kerf-binaries"
description = "Language-server and debug-adapter binaries pinned by release asset and sha256, installed from GitHub releases through ketch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
fs-kit = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
