[package]
name = "kerf-ffi"
description = "Kerf's C ABI for native hosts: an editor over kerf-core and a view drawn by kerf-render, behind checked pointers and caught panics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib for the SwiftPM host, cdylib for hosts that load a library, rlib
# so the Rust end-to-end test calls the same functions.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
kerf-core = { workspace = true }
kerf-render = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
cbindgen = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
# A C ABI is raw pointers from the host; every `unsafe` block says what the
# host promised in the header.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
