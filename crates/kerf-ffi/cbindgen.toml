# Header for native hosts, written by tests/header.rs (KERF_BLESS=1 rewrites it).
language = "C"
header = "/* SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-kerf-Royalty-Free */"
autogen_warning = "/* Generated by cbindgen from crates/kerf-ffi. Do not edit; run KERF_BLESS=1 cargo test -p kerf-ffi --test header. */"
include_guard = "KERF_H"
cpp_compat = true
documentation = true
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[defines]
"target_os = macos" = "__APPLE__"
