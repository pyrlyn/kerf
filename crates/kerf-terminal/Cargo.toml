[package]
name = "kerf-terminal"
description = "Kerf's integrated terminals: a PTY per tab started after the Workspace Trust check, a VT screen model with capped scrollback, and tabs marked by who opened them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
kerf-core = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
