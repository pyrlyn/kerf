[package]
name = "kerf-workspace"
description = "Kerf's workspace model without UI: recent folders, opening a folder, the Workspace Trust prompt read from manifests, restricted mode and revoking trust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace versions live in the root `[workspace.dependencies]`.
kerf-core = { workspace = true }
kerf-plugin = { workspace = true }
wasm-plugin-host = { workspace = true }
fs-kit = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
config-schema = { workspace = true }
schemars = { workspace = true }
# Unused in code: pins the workspace `preserve_order` feature into this
# crate's own test builds, so the committed schema has one key order.
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
