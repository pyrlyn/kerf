[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later OR LicenseRef-kerf-Royalty-Free"
repository = "https://github.com/pyrlyn/kerf"

[workspace.dependencies]
# Text rope for `kerf-core`: the most used editor rope (Helix), stable, with
# the char/line/UTF-16 metrics the semantic layer and LSP need. `crop` is
# newer with a smaller install base; `xi-rope` is unmaintained since 2019.
ropey = "1.6.1"
# Typed errors in library crates (shared rule in the monorepo's rust.md).
thiserror = "2"
# Incremental parser and query engine for `kerf-semantic`: the parser Zed,
# Helix and Neovim build on, and the only one that re-parses from an old tree.
tree-sitter = "0.27.1"
# Rust grammar and its tags query for `kerf-semantic`.
tree-sitter-rust = "0.24.2"
# Serde derives for the plugin lockfile's types in `kerf-plugin-lock`.
serde = { version = "1.0.229", features = ["derive"] }
# TOML for the plugin lockfile: the `toml` row in the monorepo's rust.md, with
# serde (de)serialization; no comment-preserving edits are needed because
# Kerf writes the whole file.
toml = "1.1.8"
# Atomic writes for the plugin lockfile: the shared crate in `packages/`
# (pyrlyn/crates) that owns atomic file replacement, so no second copy here.
fs-kit = "0.1.0"
# Test-only: the lockfile's JSON Schema from its types (rust.md, Config files).
schemars = "1.2.3"
# Test-only: the shared stale-schema check from `packages/` (pyrlyn/crates).
config-schema = "0.1.0"
# Test-only: per-test temporary directories.
tempfile = "3.27.0"
# Path dependency for the edit-event type; `kerf-semantic` never touches the buffer.
kerf-core = { path = "crates/kerf-core" }
